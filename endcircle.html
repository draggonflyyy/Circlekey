<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The End Circle</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none !important; 
            overflow: hidden;
            position: relative;
        }

        /* CURSEUR MAIN */
        #custom-cursor {
            position: fixed;
            width: 80px; 
            height: auto;
            pointer-events: none; 
            z-index: 1000;
            transform: translate(-10%, -40%); 
            display: none;
        }

        /* CONTENEUR RESPONSIVE POUR GARDER L'ALIGNEMENT */
        .container {
            position: relative;
            width: 1100px;
            max-width: 95vw;
            max-height: 95vh;
            z-index: 5;
        }

        /* L'IMAGE DE FOND */
        .center-image {
            width: 100%; 
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* BOUTON SECRET (Haut Droite) */
        .secret-trigger {
            position: absolute;
            top: 4%;
            right: 4%;
            width: 13%; 
            z-index: 500;
            transition: transform 0.3s ease;
        }

        .secret-trigger:hover {
            transform: scale(1.15);
        }

        .secret-trigger img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* LIEN BACK */
        .back-link {
            position: absolute;
            bottom: 4%;
            right: 4%;
            font-family: Arial, sans-serif;
            color: white;
            text-decoration: none;
            font-size: 18px;
            z-index: 500;
        }

        /* LE CARRÉ INTERACTIF AVEC TEXTE CENTRÉ */
        .eye-button {
            position: absolute;
            bottom: 18%; 
            left: 18%;   
            width: 70px;
            height: 70px;
            border: 1px solid #666;
            z-index: 500;
            background: rgba(255, 255, 255, 0.05);
            transition: border-color 0.3s;
            cursor: none !important;
            
            /* Centrage du texte "clic" */
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Style du texte */
            font-family: Arial, sans-serif;
            color: white;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        .eye-button:hover {
            border-color: white;
        }

        /* LECTEUR AUDIO */
        audio {
            position: absolute;
            bottom: 22%;
            left: 27%; 
            filter: invert(100%);
            display: none;
            z-index: 600;
            width: 280px;
        }

        /* ========================================================
           RÈGLES SPÉCIALES POUR LES TÉLÉPHONES (ÉCRANS < 768px)
           ======================================================== */
        @media (max-width: 768px) {
            body {
                cursor: auto !important; 
            }

            #custom-cursor {
                display: none !important; 
            }

            .container {
                width: 90vw;
            }

            .eye-button {
                width: 45px;
                height: 45px;
                bottom: 16%;
                left: 15%;
                font-size: 9px;
                letter-spacing: 1px;
            }

            audio {
                width: 180px;
                bottom: 18%;
                left: 32%;
            }

            .back-link {
                font-size: 14px;
                bottom: 2%;
                right: 2%;
            }
        }
    </style>
</head>
<body>

    <img src="main.png" id="custom-cursor" alt="cursor">

    <div class="container">
        <img src="endcircle.png" class="center-image" alt="end circle">

        <a href="secret.html" class="secret-trigger">
            <img src="boutonsecret.png" alt="secret button">
        </a>

        <a href="index.html" class="back-link">back</a>

        <div class="eye-button" id="toggle-audio">clic</div>

        <audio id="player" controls>
            <source src="endcircle.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const cursor = document.getElementById('custom-cursor');
        
        // Gestion du curseur desktop uniquement
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', e => {
                cursor.style.display = 'block';
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });
            document.addEventListener('mouseleave', () => {
                cursor.style.display = 'none';
            });
        }

        // Toggle affichage du lecteur audio
        const eyeBtn = document.getElementById('toggle-audio');
        const player = document.getElementById('player');
        
        eyeBtn.addEventListener('click', () => {
            if (player.style.display === 'none' || player.style.display === '') {
                player.style.display = 'block';
            } else {
                player.style.display = 'none';
            }
        });
    </script>

</body>
</html>
