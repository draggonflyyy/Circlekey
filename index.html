<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Key</title>
    <style>
        body { 
            background-color: black; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative;
            cursor: none !important; 
        }

        /* CURSEUR MAIN */
        #custom-cursor {
            position: fixed;
            width: 80px;
            height: auto;
            pointer-events: none; 
            z-index: 1000;
            transform: translate(-10%, -40%);
            display: none;
        }

        /* FOND NOIR UNIQUEMENT */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 1;
        }

        .container { 
            position: relative; 
            width: 1000px; 
            height: 667px; 
            z-index: 5;
            max-width: 95vw; 
            max-height: 95vh;
        }

        img.main-key { 
            width: 100%; 
            height: auto; 
            display: block; 
        }

        /* BOUTON SECRET BLEU (Invisible au départ sur PC) */
        .secret-trigger {
            position: absolute;
            left: -40px; /* Aligné par rapport au container désormais */
            bottom: 0px;
            width: 50px;
            z-index: 100;
            opacity: 0; 
            transition: opacity 0.5s ease, transform 0.3s ease;
        }

        .secret-trigger:hover {
            opacity: 1; 
            transform: scale(1.1);
        }

        /* LETTRES EN MINUSCULES */
        .lettre {
            position: absolute;
            width: 80px; 
            height: auto;
            z-index: 10;
            animation: fastSpinIn 3s linear forwards;
        }

        /* Positionnement en % par rapport au container pour rester stable */
        .c1 { top: -5%;  left: -8%;  animation-delay: 0.1s; }
        .i1 { top: 15%;  left: -7%;  animation-delay: 0.3s; }
        .r1 { top: 35%;  left: -9%;  animation-delay: 0.5s; }
        .c2 { top: 55%;  left: -6%;  animation-delay: 0.7s; }
        .l1 { top: 75%;  left: -8%;  animation-delay: 0.9s; }
        .e1 { top: 92%;  left: -7%;  animation-delay: 1.1s; }

        .k1 { top: 10%;  right: -8%; animation-delay: 1.3s; }
        .e2 { top: 40%;  right: -7%; animation-delay: 1.5s; }
        .y1 { top: 70%;  right: -8%; animation-delay: 1.7s; }

        @keyframes fastSpinIn {
            from { transform: rotate(-3600deg); }
            to { transform: rotate(0deg); }
        }
        
        /* ZONES DE CLIC INVISIBLES */
        .spot { 
            position: absolute; 
            border-radius: 50%; 
            z-index: 20; 
            background: rgba(255,255,255,0);
        }

        .s1 { top: 7%;  left: 5%;  width: 10%; height: 16%; }
        .s2 { top: 7%;  left: 17%; width: 10%; height: 16%; }
        .s3 { top: 7%;  left: 29%; width: 10%; height: 16%; }
        .s4 { top: 65%; left: 71%; width: 15%; height: 23%; }
        .s5 { top: 85%; left: 68%; width: 7%;  height: 10%; }
        .s6 { top: 61%; left: 86%; width: 10%; height: 15%; }
        .s7 { top: 78%; left: 88%; width: 7%;  height: 10%; }
        .s8 { top: 86%; left: 77%; width: 9%;  height: 12%; }
        .s9 { top: 87%; left: 88%; width: 7%;  height: 10%; }

        /* ========================================================
           RÈGLES SPÉCIALES POUR LES TÉLÉPHONES (ÉCRANS < 768px)
           ======================================================== */
        @media (max-width: 768px) {
            body {
                cursor: auto !important; 
            }
            
            #custom-cursor {
                display: none !important; 
            }

            .container {
                width: 82vw; /* Réduit un poil pour laisser de la place aux lettres sur les côtés */
                height: calc(82vw * (667 / 1000));
            }

            .lettre {
                width: 6vw; /* Devient proportionnel à la taille de l'écran */
            }

            /* Ajustements légers des positions sur mobile pour éviter qu'elles sortent de l'écran */
            .c1 { left: -6%; }
            .i1 { left: -5%; }
            .r1 { left: -7%; }
            .c2 { left: -4%; }
            .l1 { left: -6%; }
            .e1 { left: -5%; }
            .k1 { right: -5%; }
            .e2 { right: -4%; }
            .y1 { right: -5%; }

            .secret-trigger {
                left: -6%;
                bottom: -5%;
                width: 28px;
                opacity: 0.5; /* Visible sur mobile car pas de survol au doigt possible */
            }
        }
    </style>
</head>
<body>

    <img src="main.png" id="custom-cursor" alt="cursor">

    <div class="background-overlay"></div>

    <div class="container">
        <a href="secret.html" class="secret-trigger">
            <img src="boutonsecret.png" alt="secret" style="width: 100%;">
        </a>

        <img src="c.png" class="lettre c1">
        <img src="i.png" class="lettre i1">
        <img src="r.png" class="lettre r1">
        <img src="c_2.png" class="lettre c2">
        <img src="l.png" class="lettre l1">
        <img src="e.png" class="lettre e1">
        <img src="k.png" class="lettre k1">
        <img src="e_2.png" class="lettre e2">
        <img src="y.png" class="lettre y1">

        <img src="circlekey.png" class="main-key">
        
        <a href="worst.html" class="spot s1"></a>
        <a href="kind.html" class="spot s2"></a>
        <a href="stupid.html" class="spot s3"></a>
        <a href="relief.html" class="spot s4"></a>
        <a href="time.html" class="spot s5"></a>
        <a href="underated.html" class="spot s6"></a>
        <a href="well.html" class="spot s7"></a>
        <a href="when.html" class="spot s8"></a>
        <a href="endcircle.html" class="spot s9"></a>
    </div>

    <script>
        const cursor = document.getElementById('custom-cursor');
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', e => {
                cursor.style.display = 'block';
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });
            document.addEventListener('mouseleave', () => {
                cursor.style.display = 'none';
            });
        }
    </script>

</body>
</html>
