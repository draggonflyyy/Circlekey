<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kind - circlekey</title>
    <style>
        body { 
            background-color: black; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
            cursor: none !important; /* Cache le curseur standard */
        }

        /* CURSEUR MAIN PERSONNALISÉ */
        #custom-cursor {
            position: fixed;
            width: 80px;
            height: auto;
            pointer-events: none; 
            z-index: 1000;
            transform: translate(-10%, -40%);
            display: none;
        }

        /* EN HAUT À DROITE : zzz.png */
        .top-right-detail {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px; 
            height: auto;
            opacity: 1;
        }

        /* CENTRE : Serrure et Lecteur */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            z-index: 5;
            max-width: 90vw; /* Évite de dépasser sur mobile */
        }

        .serrure {
            max-width: 220px;
            width: 100%;
            height: auto;
            display: block;
        }

        audio { 
            filter: invert(100%); 
            width: 280px; 
            max-width: 100%; /* S'adapte si l'écran est minuscule */
        }

        /* BAS À GAUCHE : Bouton Ovale (onecircle.png) */
        .back-zone {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 80px;
            text-decoration: none;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 500;
            cursor: none !important;
        }

        .back-zone:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .back-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* TITRE EN BAS À DROITE */
        h1 { 
            position: absolute; 
            bottom: 15px; 
            right: 20px; 
            font-family: Arial, sans-serif;
            font-size: 0.6rem;
            color: #FEFEFE; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            margin: 0;
        }

        /* ========================================================
           RÈGLES SPÉCIALES POUR LES TÉLÉPHONES (ÉCRANS < 768px)
           ======================================================== */
        @media (max-width: 768px) {
            body {
                cursor: auto !important; /* Le tactile fonctionne à nouveau normalement */
            }

            #custom-cursor {
                display: none !important; /* Disparition de la main */
            }

            .back-zone {
                cursor: auto !important;
                bottom: 20px; /* Un poil plus haut pour les pouces */
                left: 20px;
                width: 65px;  /* Un poil plus compact */
            }

            .top-right-detail {
                top: 25px;
                right: 25px;
                width: 35px;
            }

            h1 {
                bottom: 25px;
                right: 25px;
            }

            .serrure {
                max-width: 180px; /* Un poil plus petit pour laisser respirer le lecteur */
            }
        }
    </style>
</head>
<body>

    <img src="main.png" id="custom-cursor" alt="cursor">

    <img src="zzz.png" class="top-right-detail">

    <div class="content-container">
        <img src="serrure.jpg" class="serrure">
        <audio controls>
            <source src="kind.mp3" type="audio/mpeg">
        </audio>
    </div>

    <a href="index.html" class="back-zone">
        <img src="onecircle.png" class="back-img">
    </a>

    <h1>002</h1>

    <script>
        const cursor = document.getElementById('custom-cursor');
        
        // Active le curseur uniquement si on est sur un grand écran (ordinateur)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', e => {
                cursor.style.display = 'block';
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });
            document.addEventListener('mouseleave', () => {
                cursor.style.display = 'none';
            });
        }
    </script>

</body>
</html>
